[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "refusal-geometry"
version = "1.0.0"
description = "The geometry of the refusal region of aligned language models: an axis, a threshold per prompt, a wide region"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Justin Bec"}]

[tool.setuptools]
packages = ["refusal"]
